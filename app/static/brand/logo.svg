<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 88" role="img" aria-label="The Girl House">
  <defs>
    <linearGradient id="tghPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#db6a9d"/>
      <stop offset="1" stop-color="#f3a9c6"/>
    </linearGradient>
    <linearGradient id="tghText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4548a"/>
      <stop offset="1" stop-color="#db6a9d"/>
    </linearGradient>
  </defs>

  <!-- Emblem: rumah pink lembut + hati -->
  <g>
    <rect x="8" y="12" width="64" height="64" rx="18" fill="url(#tghPink)"/>
    <!-- atap + badan rumah (putih) -->
    <path d="M40 24 L60 40 L60 60 Q60 62 58 62 L22 62 Q20 62 20 60 L20 40 Z"
          fill="#ffffff" opacity="0.96"/>
    <!-- cerobong kecil -->
    <rect x="52" y="27" width="5" height="9" rx="1.5" fill="#ffffff" opacity="0.9"/>
    <!-- hati di badan rumah -->
    <path d="M40 46 c-2.4-3.4-8-2-8 2.2 0 3 3.4 5.2 8 8.4 4.6-3.2 8-5.4 8-8.4 0-4.2-5.6-5.6-8-2.2 Z"
          fill="#e07aa6"/>
  </g>

  <!-- Wordmark -->
  <text x="88" y="46" font-family="'Playfair Display', Georgia, 'Times New Roman', serif"
        font-size="27" font-weight="700" letter-spacing="0.5" fill="url(#tghText)">The Girl House</text>
  <text x="89" y="66" font-family="'Inter', -apple-system, 'Segoe UI', sans-serif"
        font-size="9.5" font-weight="600" letter-spacing="3.2" fill="#c98bab">YOUR STYLE, OUR HOME</text>
</svg>
