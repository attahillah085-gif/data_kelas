# Konfigurasi Nginx untuk The Girl House (reverse proxy ke Gunicorn).
# Salin ke: /etc/nginx/sites-available/thegirlhouse
# Ganti "DOMAIN_ANDA" dengan domain kamu, mis. app.thegirlhouse.id
server {
    listen 80;
    server_name DOMAIN_ANDA;

    client_max_body_size 10M;

    # File statis dilayani langsung oleh Nginx (lebih cepat)
    location /static/ {
        alias /var/www/thegirlhouse/app/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
